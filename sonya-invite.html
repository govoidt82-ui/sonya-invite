<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Для Сони</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --ink:#f6f3ec;
  --neon:rgba(255,255,255,.9);
  --gold:#d4af37;
  --gold-soft:rgba(212,175,55,.38);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"Manrope",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
/* soft white neon along the edges */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.55),
    inset 0 0 18px 2px rgba(255,255,255,.22),
    inset 0 0 70px rgba(255,255,255,.07);
  border-radius:0;
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
main{position:relative;z-index:4;width:100%;max-width:560px;padding:32px 28px;text-align:center}
.scene{display:none;flex-direction:column;align-items:center;gap:40px}
.scene.on{display:flex}
h1{
  margin:0;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-style:italic;font-weight:500;
  font-size:clamp(30px,7.4vw,46px);
  line-height:1.22;letter-spacing:.005em;
  text-shadow:0 0 22px rgba(255,255,255,.18);
  max-width:20ch;
}
h1 .w{display:inline-block;white-space:pre}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
button,a.btn{
  display:inline-block;text-decoration:none;
  font:500 16px/1 "Manrope",system-ui,sans-serif;
  letter-spacing:.04em;
  color:#fff;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.85);
  padding:15px 34px;border-radius:999px;cursor:pointer;
  box-shadow:0 0 0 1px var(--gold-soft),0 0 16px rgba(212,175,55,.28),inset 0 0 12px rgba(212,175,55,.08);
  transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
  -webkit-tap-highlight-color:transparent;
}
button:hover,a.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.07);
  box-shadow:0 0 0 1px rgba(212,175,55,.6),0 0 26px rgba(212,175,55,.45),inset 0 0 14px rgba(212,175,55,.14)}
button:active,a.btn:active{transform:scale(.97)}
button:focus-visible,a.btn:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.btns{opacity:0;animation:rise .8s ease forwards}
.fly{opacity:0;animation:fly .9s cubic-bezier(.16,.84,.3,1) forwards}
@keyframes fly{
  0%{opacity:0;transform:translateX(120px) scale(.85);filter:blur(10px)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro .w{opacity:0;animation:rise .9s ease forwards}
@media (prefers-reduced-motion:reduce){
  .fly,.btns,.intro .w{animation-duration:.01s;animation-delay:0s!important}
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <section class="scene on intro" id="s1">
    <h1 id="t1">Соня, привет) Приглашаю тебя погулять и сходить на каток. Не хотела бы ты сходить?)</h1>
    <div class="row btns" style="animation-delay:1.6s">
      <button id="yes">да</button>
      <button id="no">нет</button>
    </div>
  </section>

  <section class="scene" id="s2">
    <h1 id="t2" class="fly">Шикарно, на какой каток пойдём?)</h1>
    <div class="row btns" style="animation-delay:.7s">
      <button data-rink>Охта Парк</button>
      <button data-rink>Флагшток</button>
    </div>
  </section>

  <section class="scene" id="s3">
    <h1 class="fly">Шикарно) Чуть позже спишемся и договоримся о времени и числе)</h1>
    <div class="row btns" style="animation-delay:1.1s">
      <a class="btn" id="send" href="https://t.me/S5XZ2" target="_blank" rel="noopener">Отправить ответ</a>
    </div>
  </section>

  <section class="scene" id="s4">
    <h1 class="fly">Ну хорошо) Если захочешь — пиши)</h1>
  </section>
</main>

<script>
(function(){
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // intro: words appear one by one
  var t1 = document.getElementById("t1");
  var words = t1.textContent.split(" ");
  t1.textContent = "";
  words.forEach(function(w,i){
    var s = document.createElement("span");
    s.className = "w";
    s.textContent = w + (i < words.length-1 ? " " : "");
    s.style.animationDelay = (0.15 + i*0.09) + "s";
    t1.appendChild(s);
  });

  function show(id){
    document.querySelectorAll(".scene").forEach(function(s){s.classList.remove("on")});
    document.getElementById(id).classList.add("on");
  }

  // snow
  var cv = document.getElementById("snow"), ctx = cv.getContext("2d");
  var flakes = [], running = false, W, H, dpr;
  function size(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = cv.width = innerWidth*dpr; H = cv.height = innerHeight*dpr;
  }
  addEventListener("resize", size); size();
  function make(){
    var n = reduce ? 40 : 130;
    for(var i=0;i<n;i++){
      flakes.push({
        x:Math.random()*W, y:Math.random()*H - H,
        r:(Math.random()*2.6+0.8)*dpr,
        v:(Math.random()*0.8+0.4)*dpr*(reduce?0.5:1),
        d:Math.random()*Math.PI*2,
        a:Math.random()*0.5+0.4
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    flakes.forEach(function(f){
      f.y += f.v; f.d += 0.012; f.x += Math.sin(f.d)*0.45*dpr;
      if(f.y > H+10){ f.y = -10; f.x = Math.random()*W; }
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,"+f.a+")";
      ctx.shadowColor = "rgba(255,255,255,.7)";
      ctx.shadowBlur = 6*dpr;
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  function startSnow(){
    if(running) return; running = true; make(); tick();
  }

  document.getElementById("yes").addEventListener("click", function(){
    show("s2"); startSnow();
  });
  document.getElementById("no").addEventListener("click", function(){
    show("s4");
  });
  document.querySelectorAll("[data-rink]").forEach(function(b){
    b.addEventListener("click", function(){
      var msg = "Да, идём на " + b.textContent + ")";
      document.getElementById("send").href = "https://t.me/S5XZ2?text=" + encodeURIComponent(msg);
      show("s3");
    });
  });
})();
</script>
</body>
</html>
